log_level: info

server:
  address: 127.0.0.1:8787

# Local mode only permits loopback listeners. See docs/authorization.md for OIDC.
auth:
  mode: local
  # public_url: https://memory.example.com
  session_ttl: 8h
  token_ttl: 24h
  # oidc:
  #   issuer: https://identity.example.com/realms/work
  #   client_id: ohyeah
  #   client_secret: "" # Prefer OHYEAH_AUTH_OIDC_CLIENT_SECRET.
  # principals:
  #   - subject: "stable-oidc-subject"
  #     admin: false
  #     projects: [example]
  #     sync_projects: []

meilisearch:
  # managed: serve downloads and owns the local Meilisearch process.
  # external: connect to an independently managed instance.
  mode: managed
  # directory: /absolute/path/to/ohyeah/meilisearch
  url: http://127.0.0.1:7700
  api_key: ""
  index: ohyeah_memory_v1
  batch_size: 100
  embedding:
    enabled: false
    name: qwen
    url: http://127.0.0.1:11434/api/embed
    model: qwen3-embedding:0.6b
    dimensions: 1024
    document_template_max_bytes: 12000
    semantic_ratio: 0.5

sync:
  reconcile_interval: 15m
  debounce: 2s
  collector_timeout: 5m
  max_file_size: 268435456

projects:
  example:
    enabled: true
    workspace: /absolute/path/to/workspace
    types:
      documents:
        enabled: true
        collector:
          command: /absolute/path/to/example-collector
          args: [collect]
          revision: 1
          timeout: 5m
        mounts:
          work-memory:
            enabled: true
            root: /absolute/path/to/workspace/docs
            revision: 1
            options:
              scope: recent
